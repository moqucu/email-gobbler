name: EmailGobbler
options:
  bundleIdPrefix: com.moqucu
  deploymentTarget:
    macOS: "13.0"
packages:
  EmailGobbler:
    path: ../EmailGobbler
targets:
  EmailGobbler:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: EmailGobbler
        product: EmailGobblerService
      - package: EmailGobbler
        product: EmailGobblerCore
      - package: EmailGobbler
        product: GnuCashBook
    settings:
      base:
        PRODUCT_NAME: EmailGobbler
        PRODUCT_BUNDLE_IDENTIFIER: com.moqucu.EmailGobbler
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/EmailGobbler.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
